---
# role: tftpd
# file: handlers/main.yml

- name: TFTPD | Reload systemd units
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: reload systemd

- name: TFTPD | Restart the TFTP daemon
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: "{{ __tftpd_service }}"
    state: restarted
  listen: restart tftpd
