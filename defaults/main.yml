---
# role: tftpd
# file: defaults/main.yml

# Absolute directory served by the TFTP daemon.
tftpd_root: /srv/tftp

# Owner of the TFTP root directory.
tftpd_root_owner: root

# Group of the TFTP root directory.
tftpd_root_group: root

# Permission mode of the TFTP root directory.
tftpd_root_mode: '0755'

# Additional tftp-hpa daemon options.
tftpd_options: --secure

# SELinux file type for the TFTP root and its contents.
tftpd_setype: public_content_t
