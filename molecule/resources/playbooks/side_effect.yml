---
# role: tftpd
# file: molecule/resources/playbooks/side_effect.yml

- name: TFTPD | Exercise configuration updates and service recovery
  hosts: all
  gather_facts: true
  tasks:
    - name: TFTPD | Apply an alternative root and daemon options
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        tftpd_root: /srv/tftp-alternative
        tftpd_options: --secure --verbose

    - name: TFTPD | Publish an alternative transfer fixture
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /srv/tftp-alternative/updated.txt
        content: "Updated TFTP root\n"
        owner: root
        group: root
        mode: '0644'

    - name: TFTPD | Verify the daemon uses the updated root
      ansible.builtin.command:
        argv: [tftp, -m, binary, '127.0.0.1', -c, get, updated.txt, /dev/stdout]
      changed_when: false
      register: __tftpd_updated_transfer
      failed_when: __tftpd_updated_transfer.rc != 0 or __tftpd_updated_transfer.stdout != 'Updated TFTP root'

    - name: TFTPD | Restore the original configuration before testing service recovery
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: TFTPD | Stop and disable service activation
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: "{{ 'tftpd-hpa.service' if ansible_facts.os_family == 'Debian' else 'tftp.socket' }}"
        enabled: false
        state: stopped

    - name: TFTPD | Stop the socket-activated daemon
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: tftp.service
        state: stopped
      when: ansible_facts.os_family != 'Debian'
